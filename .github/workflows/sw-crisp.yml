# Sonic Weaponry: Crisp's Mac build and its checks (ci-sw/README.md). Builds Crisp only, with the same nih-plug
# commit and Rust nightly as the Crisp builds the Wook Bass Generators ship, then checks that the build shows hosts
# exactly what the shipped Windows copy shows (class ID, parameters, state) and sounds the same (null test).
# Crisp's own code is not changed.
name: SW Crisp

on:
  push:
    branches: ['sw/**']
  workflow_dispatch:
    inputs:
      release:
        description: 'sign: sign with the Developer ID, notarize, staple and pack the zip (needs the mac-release secrets)'
        type: choice
        options: [none, sign]
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: nightly-2024-11-27   # rustc dff3e7cc (2024-11-26), the compiler in both shipped Crisp binaries
  VST3_SDK_TAG: v3.8.1_build_84          # interfaces for the test host only (MIT)
  NULL_LIMIT_DBFS: '-999'              # bit-identical: measured 2026-11-20, every macOS render equals the Windows one

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS universal build and checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the test signal
        run: cd ci-sw/signal && shasum -a 256 -c SHA256SUMS
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-apple-darwin --target aarch64-apple-darwin
          rustc --version --verbose
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: macos-cargo-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Build Crisp (universal VST3)
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.13
          cargo xtask bundle-universal crisp --release
          ls -la target/bundled
          lipo -info target/bundled/Crisp.vst3/Contents/MacOS/Crisp
          shasum -a 256 target/bundled/Crisp.vst3/Contents/MacOS/Crisp
          codesign -dv target/bundled/Crisp.vst3 2>&1 | head -5 || true
      - name: Build the test host
        run: |
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3_pluginterfaces.git ci-sw/vst3_check/sdk/pluginterfaces
          cmake -S ci-sw/vst3_check -B ci-sw/vst3_check/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ci-sw/vst3_check/build --config Release
      - name: Checks (Apple Silicon)
        if: ${{ !cancelled() }}
        run: ci-sw/run_checks.sh "$PWD/ci-sw/vst3_check/build/vst3_check" "$PWD/target/bundled/Crisp.vst3" macos-arm64 "$PWD/ci-results"
      - name: Checks (Intel, through Rosetta)
        if: ${{ !cancelled() }}
        run: ci-sw/run_checks.sh "$PWD/ci-sw/vst3_check/build/vst3_check" "$PWD/target/bundled/Crisp.vst3" macos-x86_64 "$PWD/ci-results" "arch -x86_64"
      - name: Package the build
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/bundled/Crisp.vst3 dist/Crisp-macos-universal-unsigned.zip
          shasum -a 256 target/bundled/Crisp.vst3/Contents/MacOS/Crisp | cut -d' ' -f1 > dist/unsigned-program.sha256
          shasum -a 256 dist/*
      # The signing rehearsal (ci-sw/README.md, "Signing"): the same keychain, signing and checking code as the release
      # job, with a throwaway self-signed identity made on this runner. Nothing from it goes to anyone.
      - name: Signing rehearsal
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          export REHEARSAL_P12_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$REHEARSAL_P12_PASSWORD"
          ci-sw/signing/make_test_identity.sh "$RUNNER_TEMP/rehearsal-id"
          ci-sw/signing/keychain.sh setup "$RUNNER_TEMP/rehearsal.keychain-db" rehearsal \
            "$RUNNER_TEMP/rehearsal-id/application.p12:REHEARSAL_P12_PASSWORD" | tee "$RUNNER_TEMP/keychain.txt"
          identity=$(sed -n 's/^bundle signer: .*(\([0-9A-F]\{40\}\))$/\1/p' "$RUNNER_TEMP/keychain.txt")
          rm -rf "$RUNNER_TEMP/rehearsal-id"
          ci-sw/signing/sign_bundle.sh target/bundled/Crisp.vst3 "$RUNNER_TEMP/rehearsal" "$identity"
          status=0
          ci-sw/signing/check_signed_bundle.sh rehearsal "$RUNNER_TEMP/rehearsal/Crisp.vst3" || status=1
          ci-sw/run_checks.sh "$PWD/ci-sw/vst3_check/build/vst3_check" "$RUNNER_TEMP/rehearsal/Crisp.vst3" signed-rehearsal-arm64 "$RUNNER_TEMP/rehearsal-results" || status=1
          cp -R ci-results/macos-arm64 "$RUNNER_TEMP/rehearsal-results/"
          ci-sw/null_test.sh "$PWD/ci-sw/vst3_check/build/vst3_check" "$RUNNER_TEMP/rehearsal-results" signed-rehearsal-arm64 macos-arm64 -999 || status=1
          ci-sw/signing/make_release_zip.sh "$RUNNER_TEMP/rehearsal/Crisp.vst3" "$RUNNER_TEMP/Crisp-rehearsal.zip" || status=1
          exit $status
      - name: Delete the rehearsal keychain
        if: ${{ always() }}
        run: ci-sw/signing/keychain.sh delete "$RUNNER_TEMP/rehearsal.keychain-db"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: crisp-macos
          path: |
            dist/
            ci-results/
          retention-days: 30

  windows:
    name: Windows build and checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the test signal
        run: cd ci-sw/signal && sha256sum -c SHA256SUMS
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc --version --verbose
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: windows-cargo-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Build Crisp (VST3)
        run: |
          cargo xtask bundle crisp --release
          ls -la target/bundled target/bundled/Crisp.vst3/Contents/x86_64-win
          sha256sum target/bundled/Crisp.vst3/Contents/x86_64-win/Crisp.vst3
      - name: Build the test host
        run: |
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3_pluginterfaces.git ci-sw/vst3_check/sdk/pluginterfaces
          cmake -S ci-sw/vst3_check -B ci-sw/vst3_check/build
          cmake --build ci-sw/vst3_check/build --config Release
      - name: Checks
        if: ${{ !cancelled() }}
        run: ci-sw/run_checks.sh "$PWD/ci-sw/vst3_check/build/Release/vst3_check.exe" "$PWD/target/bundled/Crisp.vst3" windows-x64 "$PWD/ci-results"
      - name: Package the build and the test host
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          7z a -tzip dist/Crisp-windows-x64.zip ./target/bundled/Crisp.vst3 > /dev/null
          cp ci-sw/vst3_check/build/Release/vst3_check.exe dist/
          sha256sum dist/*
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: crisp-windows
          path: |
            dist/
            ci-results/
          retention-days: 30

  compare:
    name: Sound null test (macOS against Windows)
    needs: [macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build the test host
        run: |
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3_pluginterfaces.git ci-sw/vst3_check/sdk/pluginterfaces
          cmake -S ci-sw/vst3_check -B ci-sw/vst3_check/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ci-sw/vst3_check/build --config Release
      - name: Null tests
        run: |
          mkdir -p all
          cp -R artifacts/crisp-macos/ci-results/* all/
          cp -R artifacts/crisp-windows/ci-results/* all/
          status=0
          for label in macos-arm64 macos-x86_64; do
            ci-sw/null_test.sh "$PWD/ci-sw/vst3_check/build/vst3_check" all "$label" windows-x64 "$NULL_LIMIT_DBFS" || status=1
          done
          ci-sw/null_test.sh "$PWD/ci-sw/vst3_check/build/vst3_check" all macos-x86_64 macos-arm64 "$NULL_LIMIT_DBFS" || status=1
          exit $status

  # Started by hand only (release: sign), on an sw/ branch, after every other job of the run is green. Signs the very
  # build the macos job checked with SONIC WEAPONRY LLC's Developer ID, has Apple notarize it, staples the ticket to the
  # bundle, checks everything again, and packs the zip for the Wook Bass Generators (ci-sw/README.md, "Signing").
  macos-release:
    name: Sign, notarize and pack (release)
    needs: [macos, windows, compare]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == 'sign' && startsWith(github.ref, 'refs/heads/sw/') }}
    runs-on: macos-latest
    environment: mac-release
    env:
      EXPECTED_SIGNER: SONIC WEAPONRY LLC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crisp-macos
          path: artifact
      - name: Unpack the checked build
        run: |
          mkdir -p unsigned
          ditto -x -k artifact/dist/Crisp-macos-universal-unsigned.zip unsigned
          want=$(cat artifact/dist/unsigned-program.sha256)
          got=$(shasum -a 256 unsigned/Crisp.vst3/Contents/MacOS/Crisp | cut -d' ' -f1)
          echo "checked build $want, unpacked $got"
          test "$want" = "$got"
      - name: Signing keychain
        env:
          MACOS_CERT_APPLICATION_P12: ${{ secrets.MACOS_CERT_APPLICATION_P12 }}
          MACOS_CERT_APPLICATION_PASSWORD: ${{ secrets.MACOS_CERT_APPLICATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "$MACOS_CERT_APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/application.p12"
          ci-sw/signing/keychain.sh setup "$RUNNER_TEMP/release.keychain-db" developer-id \
            "$RUNNER_TEMP/application.p12:MACOS_CERT_APPLICATION_PASSWORD" | tee "$RUNNER_TEMP/keychain.txt"
          rm -f "$RUNNER_TEMP/application.p12"
      - name: Sign
        run: |
          identity=$(sed -n 's/^bundle signer: .*(\([0-9A-F]\{40\}\))$/\1/p' "$RUNNER_TEMP/keychain.txt")
          ci-sw/signing/sign_bundle.sh unsigned/Crisp.vst3 signed "$identity"
      - name: Check the signature (before notarization)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ci-sw/signing/check_signed_bundle.sh developer-id signed/Crisp.vst3
      - name: Notarize and staple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          status=0
          ci-sw/signing/notarize_bundle.sh signed/Crisp.vst3 ci-results/notary || status=$?
          rm -f "$APPLE_API_KEY_PATH"
          exit $status
      - name: Check the signature, notarization and staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ci-sw/signing/check_signed_bundle.sh developer-id signed/Crisp.vst3 ci-results/notary
      - name: The plugin checks on the signed build (both slices; renders bit-identical to the checked build)
        run: |
          git clone -q --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3_pluginterfaces.git ci-sw/vst3_check/sdk/pluginterfaces
          cmake -S ci-sw/vst3_check -B ci-sw/vst3_check/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ci-sw/vst3_check/build --config Release
          tool="$PWD/ci-sw/vst3_check/build/vst3_check"
          status=0
          ci-sw/run_checks.sh "$tool" "$PWD/signed/Crisp.vst3" signed-arm64 "$PWD/ci-results" || status=1
          ci-sw/run_checks.sh "$tool" "$PWD/signed/Crisp.vst3" signed-x86_64 "$PWD/ci-results" "arch -x86_64" || status=1
          cp -R artifact/ci-results/macos-arm64 artifact/ci-results/macos-x86_64 ci-results/
          ci-sw/null_test.sh "$tool" ci-results signed-arm64 macos-arm64 -999 || status=1
          ci-sw/null_test.sh "$tool" ci-results signed-x86_64 macos-x86_64 -999 || status=1
          exit $status
      - name: Pack the zip
        run: |
          mkdir -p release
          ci-sw/signing/make_release_zip.sh signed/Crisp.vst3 "release/Crisp-mac-universal-signed-${GITHUB_SHA::8}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: crisp-macos-signed
          path: |
            release/
            ci-results/notary/
            ci-results/signing-developer-id/
          retention-days: 90
      - name: Delete the signing keychain
        if: ${{ always() }}
        run: |
          ci-sw/signing/keychain.sh delete "$RUNNER_TEMP/release.keychain-db"
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/application.p12"
